<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Colored Header with Theme Switcher -->
        <header class="app-header">
            <div class="header-content">
                <h1>Student Performance Dashboard</h1>
                <p>Calculate grades, analyze class performance, and manage student records.</p>
            </div>
            <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()">
                <span class="theme-icon">🌿</span> Switch to Green Theme
            </button>
        </header>

        <!-- Summary Cards -->
        <section class="summary-cards">
            <div class="card">
                <div class="card-icon">👥</div>
                <div class="card-data">
                    <h3>Total Students</h3>
                    <p id="totalStudents">0</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">📊</div>
                <div class="card-data">
                    <h3>Class Average</h3>
                    <p id="classAverage">0.0%</p>
                </div>
            </div>
            <div class="card">
                <div class="card-icon">🏆</div>
                <div class="card-data">
                    <h3>Top Scorer</h3>
                    <p id="topScorer">N/A</p>
                </div>
            </div>
        </section>

        <!-- Main Workspace -->
        <div class="workspace">
            <!-- Form Card -->
            <section class="panel form-panel">
                <h2>Add Student Marks</h2>
                <form id="studentForm">
                    <div class="input-group">
                        <label for="studentName">Student Name *</label>
                        <input type="text" id="studentName" placeholder="e.g. Ali Khan" required>
                    </div>

                    <div class="input-group">
                        <label for="regNo">Registration Number *</label>
                        <input type="text" id="regNo" placeholder="e.g. REG-1001" required>
                    </div>

                    <h3 class="sub-heading">Subject Marks (0 - 100)</h3>
                    
                    <div class="marks-grid">
                        <div class="input-group">
                            <label for="programming">Programming</label>
                            <input type="number" id="programming" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="input-group">
                            <label for="maths">Mathematics</label>
                            <input type="number" id="maths" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="input-group">
                            <label for="english">English</label>
                            <input type="number" id="english" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="input-group">
                            <label for="database">Database</label>
                            <input type="number" id="database" min="0" max="100" placeholder="0-100" required>
                        </div>
                        <div class="input-group">
                            <label for="networks">Networks</label>
                            <input type="number" id="networks" min="0" max="100" placeholder="0-100" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Record</button>
                </form>
            </section>

            <!-- Table Panel -->
            <section class="panel table-panel">
                <div class="table-header-bar">
                    <h2>Student Records</h2>
                    <div class="table-actions">
                        <input type="text" id="searchInput" placeholder="Search Reg No..." onkeyup="searchStudents()">
                        <button class="btn btn-secondary" onclick="sortStudentsByPercentage()">Sort by %</button>
                        <button class="btn btn-danger" onclick="clearAllStudents()">Clear All</button>
                    </div>
                </div>

                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Reg No</th>
                                <th>Name</th>
                                <th>Prog</th>
                                <th>Math</th>
                                <th>Eng</th>
                                <th>DB</th>
                                <th>CN</th>
                                <th>Total</th>
                                <th>%</th>
                                <th>Grade</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody">
                            <!-- Dynamic Rows -->
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
