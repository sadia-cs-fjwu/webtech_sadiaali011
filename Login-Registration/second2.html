<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>

    <link rel="stylesheet" href="blue.css">
</head>

<body>

    <div id="header">

        <div id="heading">
            <h1>Welcome to Our Website</h1>
        </div>


        <div id="nav">

            <a href="first2.html">Login</a>

            <a href="second2.html">Register</a>

        </div>

    </div>


    <div id="content">

        <div id="register-box">

            <h2>Registration Form</h2>


            <form action="third2.html" method="get">


                <div id="control">

                    <label>Login Name:</label>

                    <input type="text"
                           name="loginname"
                           required>

                </div>


                <div id="control">

                    <label>Enter Your Password:</label>

                    <input type="password"
                           name="password"
                           required>

                </div>


                <div id="control">

                    <label>Re-enter Password:</label>

                    <input type="password"
                           name="repassword"
                           required>

                </div>


                <div id="control">

                    <label>Gender:</label>

                    <input type="radio"
                           name="gender"
                           value="Male"
                           required>

                    Male

                    <input type="radio"
                           name="gender"
                           value="Female">

                    Female

                </div>


                <div id="control">

                    <label>Country:</label>

                    <select name="country" required>

                        <option value="">
                            Select Country
                        </option>

                        <option>Pakistan</option>
                        <option>India</option>
                        <option>China</option>
                        <option>United Kingdom</option>
                        <option>United States</option>
                        <option>Canada</option>
                        <option>Australia</option>
                        <option>Germany</option>
                        <option>France</option>
                        <option>Japan</option>

                    </select>

                </div>


                <div id="terms">

                    <h3>Terms and License</h3>

                    <textarea rows="7" cols="50" readonly>1. You agree to provide accurate information.
2. You are responsible for keeping your password confidential.
3. You agree to use this website responsibly.
4. You must not misuse the website.
5. You confirm that you have read these terms.
6. These terms may be updated when necessary.</textarea>

                </div>


                <div id="control">

                    <input type="checkbox"
                           name="terms"
                           required>

                    I agree to the Terms and License.

                </div>


                <div id="button">

                    <input type="submit" value="Register">

                </div>

            </form>


            <p>

                Already have an account?

                <a href="first2.html">Login</a>

            </p>

        </div>

    </div>


    <div id="footer">

        <p>© 2026 Our Website | All Rights Reserved</p>

    </div>

</body>

</html>
