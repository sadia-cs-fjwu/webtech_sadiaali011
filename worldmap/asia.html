<!DOCTYPE html>
<html>

<head>
    <title>Asia Map</title>
</head>

<body bgcolor="#EAF6FF" align="center">

    <h1><font color="#006699">Map of Asia</font></h1>

    <p>
        <font size="4">
            Click on Iran, or Saudi Arabia
            to open its map. Click on Pakistan to play the Pakistan National Anthem. 
        </font>
    </p>

    <hr width="70%">

    <br>

    <img src="images/asia.jpg"
         alt="Asia Map"
         usemap="#asia-map"
         width="700"
         height="879">

    <map name="asia-map">

        <!-- Pakistan -->
        <area shape="poly"
              coords="205,420,230,420,245,440,250,470,240,500,220,505,205,490,200,460"
              href="pakistan.html"
              alt="Pakistan">

        <!-- Iran -->
        <area shape="rect"
              coords="91,349,172,461"
              href="iran.html"
              alt="Iran">

        <!-- Saudi Arabia -->
        <area shape="rect"
              coords="10,420,130,530"
              href="saudi.html"
              alt="Saudi Arabia">

    </map>

    <br><br>

    <a href="worldmap.html">
        <font size="4"><b>Back to World Map</b></font>
    </a>

</body>
</html>
