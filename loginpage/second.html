<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body bgcolor="#F5F9FC">

<header>
    <table width="100%" bgcolor="#C6DFF1">
        <tr>
            <td align="center">
                <br>
                <font color="#234E70" size="6">
                    <b>User Account System</b>
                </font>
                <br><br>
                Create a New Account
                <br><br>
            </td>
        </tr>
    </table>
</header>

<br>

<form action="third.html" method="get">

<table align="center" cellpadding="8" bgcolor="#FFFFFF">

    <tr>
        <td colspan="2" align="center">
            <font color="#234E70" size="5">
                <b>Registration Form</b>
            </font>
        </td>
    </tr>

    <tr>
        <td>Username:</td>
        <td>
            <input type="text" name="username" required>
        </td>
    </tr>

    <tr>
        <td>Password:</td>
        <td>
            <input type="password" name="password" required>
        </td>
    </tr>

    <tr>
        <td>Confirm Password:</td>
        <td>
            <input type="password" name="confirm_password" required>
        </td>
    </tr>

    <tr>
        <td>Gender:</td>
        <td>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
        </td>
    </tr>

    <tr>
        <td>Country:</td>
        <td>
            <select name="country" required>
                <option value="">Select Country</option>
                <option>Pakistan</option>
                <option>India</option>
                <option>China</option>
                <option>United Kingdom</option>
                <option>United States</option>
                <option>Canada</option>
            </select>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <b>Terms and Conditions</b>
            <br><br>

            <textarea rows="5" cols="38" readonly>
1. Enter correct information.
2. Keep your password safe.
3. Use the website properly.
4. Do not misuse the account.
            </textarea>
        </td>
    </tr>

    <tr>
        <td colspan="2">
            <input type="checkbox" name="terms" required>
            I agree to the terms and conditions.
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Register">
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            Already registered?
            <a href="first.html">Login Here</a>
        </td>
    </tr>

</table>

</form>

<br><br>

<footer>
    <table width="100%" bgcolor="#C6DFF1">
        <tr>
            <td align="center">
                <br>
                © 2026 User Account System
                <br><br>
            </td>
        </tr>
    </table>
</footer>

</body>
</html>
