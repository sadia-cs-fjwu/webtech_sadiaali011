<!DOCTYPE html>
<html>

<head>
    <title>Registration Page</title>
</head>

<body bgcolor="#FFFFFF">

<header>
    <table width="100%" bgcolor="#AED6F1">
        <tr>
            <td align="center">
                <br>

                <font color="#4A235A" size="6">
                    <b>User Account Portal</b>
                </font>

                <br>

                <font color="#34495E" size="4">
                    Create Your Account
                </font>

                <br><br>
            </td>
        </tr>
    </table>
</header>

<br><br>

<form action="third.html" method="get">

<table align="center" cellpadding="10">

    <tr>
        <td colspan="2" align="center">

            <font color="#4A235A" size="5">
                <b>Registration Form</b>
            </font>

        </td>
    </tr>

    <tr>
        <td>Login Name:</td>
        <td>
            <input type="text" name="loginname" required>
        </td>
    </tr>

    <tr>
        <td>Enter Your Password:</td>
        <td>
            <input type="password" name="password" required>
        </td>
    </tr>

    <tr>
        <td>Re-enter Password:</td>
        <td>
            <input type="password" name="repassword" required>
        </td>
    </tr>

    <tr>
        <td>Gender:</td>
        <td>
            <input type="radio" name="gender" value="Male" required> Male
            <input type="radio" name="gender" value="Female"> Female
        </td>
    </tr>

    <tr>
        <td>Country:</td>
        <td>
            <select name="country" required>

                <option value="">Select Country</option>
                <option>Pakistan</option>
                <option>India</option>
                <option>China</option>
                <option>United Kingdom</option>
                <option>United States</option>
                <option>Canada</option>
                <option>Australia</option>
                <option>Germany</option>
                <option>France</option>
                <option>Japan</option>

            </select>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">

            <font color="#4A235A" size="4">
                <b>Terms and License</b>
            </font>

            <br><br>

            <textarea rows="7" cols="45" readonly>
1. You agree to provide accurate information when creating your account.
2. You are responsible for keeping your password confidential.
3. You agree to use this website responsibly.
4. You must not misuse or damage the website.
5. By creating an account, you confirm that you have read these terms.
6. These terms may be updated when necessary.
            </textarea>

        </td>
    </tr>

    <tr>
        <td colspan="2">
            <input type="checkbox" name="terms" required>
            I agree to the Terms and License.
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Register">
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            Already have an account?
            <a href="first.html">Login</a>
        </td>
    </tr>

</table>

</form>

<br><br>

<footer>
    <table width="100%" bgcolor="#AED6F1">
        <tr>
            <td align="center">
                <br>

                © 2026 User Account Portal | All Rights Reserved

                <br><br>
            </td>
        </tr>
    </table>
</footer>

</body>
</html>
