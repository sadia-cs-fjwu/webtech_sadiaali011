<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
</head>

<body bgcolor="#F5F9FC">

<header>
    <table width="100%" bgcolor="#C6DFF1">
        <tr>
            <td align="center">
                <br>
                <font color="#234E70" size="6">
                    <b>User Account System</b>
                </font>
                <br><br>
                Login to continue
                <br><br>
            </td>
        </tr>
    </table>
</header>

<br><br>

<form action="second.html" method="get">

<table align="center" cellpadding="10" bgcolor="#FFFFFF">

    <tr>
        <td colspan="2" align="center">
            <font color="#234E70" size="5">
                <b>Login Form</b>
            </font>
        </td>
    </tr>

    <tr>
        <td>Username:</td>
        <td>
            <input type="text" name="username" required>
        </td>
    </tr>

    <tr>
        <td>Password:</td>
        <td>
            <input type="password" name="password" required>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Login">
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            New user?
            <a href="second.html">Create Account</a>
        </td>
    </tr>

</table>

</form>

<br><br><br>

<footer>
    <table width="100%" bgcolor="#C6DFF1">
        <tr>
            <td align="center">
                <br>
                © 2026 User Account System
                <br><br>
            </td>
        </tr>
    </table>
</footer>

</body>
</html>
