<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>
</head>

<body bgcolor="#FFFFFF">

<header>
    <table width="100%" bgcolor="#AED6F1">
        <tr>
            <td align="center">
                <br>

                <font color="#4A235A" size="6">
                    <b>User Account Portal</b>
                </font>

                <br>

                <font color="#34495E" size="4">
                    Login to Your Account
                </font>

                <br><br>
            </td>
        </tr>
    </table>
</header>

<br><br>

<form action="second.html" method="get">

<table align="center" cellpadding="10">

    <tr>
        <td colspan="2" align="center">

            <font color="#4A235A" size="5">
                <b>Login</b>
            </font>

        </td>
    </tr>

    <tr>
        <td>Username:</td>
        <td>
            <input type="text" name="username" required>
        </td>
    </tr>

    <tr>
        <td>Password:</td>
        <td>
            <input type="password" name="password" required>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Login">
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            Don't have an account?
            <a href="second.html">Sign Up</a>
        </td>
    </tr>

</table>

</form>

<br><br>

<footer>
    <table width="100%" bgcolor="#AED6F1">
        <tr>
            <td align="center">
                <br>

                © 2026 User Account Portal | All Rights Reserved

                <br><br>
            </td>
        </tr>
    </table>
</footer>

</body>
</html>
